# logging
logging.level.com.crapi=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}

# Database
spring.datasource.url= jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.max-active=100
spring.datasource.max-idle=8
spring.datasource.min-idle=8

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${SERVER_PORT}

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

app.jwksJson=${JWKS}
app.jwtExpiration=${JWT_EXPIRATION:604800000}

#Mail Configuration
mail.from=${SMTP_FROM}
mail.smtp.auth=${SMTP_AUTH}
mail.smtp.host=${SMTP_HOST}
mail.smtp.port=${SMTP_PORT}
mail.smtp.email=${SMTP_EMAIL}
mail.smtp.password=${SMTP_PASS}
mail.smtp.starttls.enable=${SMTP_STARTTLS}

#Mailhog Configuration
mail.mailhog.host=${MAILHOG_HOST}
mail.mailhog.port=${MAILHOG_PORT}
mail.mailhog.auth=false
mail.mailhog.email=no-reply@example.com
mail.mailhog.password=xxxxxxxxxx
mail.mailhog.starttls.enable=false
mail.mailhog.domain=${MAILHOG_DOMAIN}

app.enable_shell_injection=${ENABLE_SHELL_INJECTION}
app.service.name=crapi-identity

# OAuth 2.0 authorization server
app.oauth.enabled=${ENABLE_OAUTH:true}
app.oauth.accessTokenExpiration=${OAUTH_ACCESS_TOKEN_EXPIRATION:3600000}
app.oauth.codeExpiration=${OAUTH_CODE_EXPIRATION:600000}
# Seeded DealerConnect client. The same secret is configured on the DealerConnect
# service; only its BCrypt hash is stored in the database.
app.oauth.dealerClientId=${OAUTH_DEALER_CLIENT_ID:dealer-connect}
app.oauth.dealerClientSecret=${OAUTH_DEALER_CLIENT_SECRET:DealerConnect!Secret123}
app.oauth.dealerRedirectUri=${OAUTH_DEALER_REDIRECT_URI:http://localhost:8900/oauth/callback}
# OAuth mode: "secure" (default) or "vulnerable". One flag turns all the OAuth
# teaching weaknesses on or off together. See the OAuth challenge docs.
app.oauth.mode=${OAUTH_MODE:secure}

api.gateway.url=${API_GATEWAY_URL}

api.gateway.username=vendorcrapi
api.gateway.password=Pa$$4Vendor_1

# max file size
spring.servlet.multipart.max-file-size=10MB
# max request size
spring.servlet.multipart.max-request-size=50MB

server.ssl.enabled=${TLS_ENABLED}
server.ssl.key-store-type=${TLS_KEYSTORE_TYPE}
server.ssl.key-store=${TLS_KEYSTORE}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-password=${TLS_KEY_PASSWORD}
server.ssl.key-alias=${TLS_KEY_ALIAS}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3