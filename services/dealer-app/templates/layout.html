{{define "top"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DealerConnect</title>
    <style>
      :root {
        --ink: #1f2937;
        --muted: #6b7280;
        --brand: #0ea5e9;
        --brand-dark: #0369a1;
        --bg: #f1f5f9;
        --card: #ffffff;
        --line: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
        color: #fff;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header .brand { font-weight: 700; font-size: 20px; letter-spacing: 0.3px; }
      header .brand span { opacity: 0.85; font-weight: 400; font-size: 14px; }
      header nav a, header nav form button {
        color: #fff;
        text-decoration: none;
        font: inherit;
        background: rgba(255, 255, 255, 0.15);
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        margin-left: 8px;
      }
      main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
        margin-bottom: 24px;
      }
      h1 { margin: 0 0 8px; font-size: 26px; }
      h2 { margin: 0 0 16px; font-size: 20px; }
      p.muted { color: var(--muted); margin-top: 0; }
      .btn {
        display: inline-block;
        background: var(--brand);
        color: #fff;
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover { background: var(--brand-dark); }
      .btn-small { padding: 7px 14px; font-size: 13px; border-radius: 8px; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      .tile { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
      .tile .name { font-weight: 600; }
      .tile .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
      .scopes span {
        display: inline-block;
        background: #e0f2fe;
        color: var(--brand-dark);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
        margin: 2px 4px 2px 0;
      }
      .notice { border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; }
      .notice.ok { background: #dcfce7; color: #166534; }
      .notice.warn { background: #fef3c7; color: #92400e; }
      .credit { font-weight: 700; }
      footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">DealerConnect <span>· premium car care</span></div>
      <nav>
        {{if and .Session .Session.LoggedIn}}
          <a href="/dashboard">Dashboard</a>
          <form method="post" action="/logout" style="display:inline">
            <button type="submit">Log out</button>
          </form>
        {{end}}
      </nav>
    </header>
    <main>{{end}}

{{define "bottom"}}</main>
    <footer>DealerConnect is a demo third-party app for the crAPI OAuth lab.</footer>
  </body>
</html>{{end}}
